project:
  name: "Insurance Claims Intelligence & Forecasting"
  version: "2.0.0"
  description: "Enterprise audit, segmentation, and next-year claims settlement ratio forecasting under IRDAI life insurance data standard"
  seed: 42
  author: "Antigravity Data Science Team"

governance:
  task_type: "Regression & Descriptive Clustering & KPI Audit"
  unit_of_analysis: "one insurer-category-year record"
  target_column: "claims_paid_ratio_no"
  target_shift: -1 # next-year forecast t+1
  positive_direction: "higher claims paid ratio indicates better settlement rate"
  privacy_status: "Public regulatory disclosure under IRDAI statutory reporting, non-PII aggregated data"
  success_criteria:
    primary_metric: "RMSE"
    secondary_metrics: ["MAE", "R2", "sMAPE"]
    baseline_threshold: "Fitted model must beat Persistence Baseline on held-out test set"
    latency_threshold_ms: 200

splits:
  strategy: "Temporal contiguous split"
  train_target_years: [2018, 2019]
  val_target_year: 2020
  test_target_year: 2021

clustering:
  algorithm: "KMeans"
  k_range: [2, 6]
  selection_criterion: "Multi-metric rank (Silhouette, Davies-Bouldin, Calinski-Harabasz, Resample ARI) with min cluster share >= 5%"
  features_excluded: ["claims_paid_ratio_no", "claims_paid_ratio_amt", "claims_paid_no", "claims_paid_amt", "total_claims_no", "total_claims_amt", "year", "category", "life_insurer"]

models:
  candidates:
    - name: "Mean baseline"
      family: "Baseline"
    - name: "Persistence baseline"
      family: "Domain Heuristic"
    - name: "Ridge"
      family: "Regularized Linear"
      alpha: 1.0
    - name: "ElasticNet"
      family: "Regularized Linear"
      alpha: 0.1
      l1_ratio: 0.5
    - name: "Random Forest"
      family: "Ensemble Bagging"
      n_estimators: 500
      min_samples_leaf: 3
      max_features: 0.7
    - name: "Gradient Boosting"
      family: "Ensemble Boosting"
      n_estimators: 100
      learning_rate: 0.05
      max_depth: 3
